[package]
name = "marmota-music"
version = "0.1.0"
edition = "2021"
description = "Liquid-glass music notch for Omarchy and Windows"
license = "MIT"

[dependencies]
gtk4 = "0.11"
cairo-rs = "0.22"
pangocairo = "0.22"
glib = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "charset", "query"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
anyhow = "1"
dirs = "7"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
sha1_smol = "1"
tungstenite ={ version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
gtk4-layer-shell = "0.8"
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(windows)'.dependencies]
gdk4-win32 = "0.11"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
